[workspace]
resolver = "3"
members = ["crates/api", "crates/render", "crates/server", "crates/client", "crates/app"]
# The Mac app's window code is compiled on macOS only (see crates/app/Cargo.toml).
default-members = ["crates/api", "crates/render", "crates/server", "crates/client", "crates/app"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
render = { path = "crates/render" }
api = { path = "crates/api" }
client = { path = "crates/client" }
serde = { version = "1", features = ["derive"] }
