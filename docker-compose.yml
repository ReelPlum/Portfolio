# Everything the site needs on one small server (2 GB RAM is plenty):
# Caddy (HTTPS) -> Rust server -> MongoDB. Only Caddy is reachable from outside.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    build: .
    restart: unless-stopped
    environment:
      SITE_NAME: ${SITE_NAME}
      SITE_URL: https://${DOMAIN}
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGODB_DB: portfolio
      RUST_LOG: info
      TRUST_PROXY: "1"
    depends_on:
      - mongo

  mongo:
    # MongoDB 8.x refuses to start on Linux kernels 6.19 to 7.0.13 (SERVER-121912),
    # which new VPS images may ship. 7.0 runs on every kernel and is supported until 2027.
    image: mongo:7.0
    restart: unless-stopped
    # Keep MongoDB's memory cache small so it fits next to everything else.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db

volumes:
  caddy_data:
  caddy_config:
  mongo_data:
