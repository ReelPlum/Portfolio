name: Links

# Checks every link, image and embed on the real site, including links to other sites and YouTube /
# Vimeo videos. It runs weekly too, because other sites change without anyone pushing here.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Chromium draws the preview images and CV PDF, which pages link to.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          SEARCH_EMBEDDINGS: hash
          RENDERS: required
      # Dead links (404, 410, unknown host, removed videos) fail; maybe-temporary problems are warnings.
      - run: npm run check:links -- --external
