name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        # MongoDB 8.x exits on Linux kernels 6.19 to 7.0.13 (SERVER-121912); 7.0 runs everywhere.
        image: mongo:7.0
        ports:
          - 27017:27017
        # Wait until MongoDB answers before the tests start.
        options: >-
          --health-cmd "mongosh --quiet --eval 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p app --all-targets -- -D warnings
      - run: cargo test -p app
