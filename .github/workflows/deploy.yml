name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A new push to a pull request replaces its older run. Runs on main are never
# cancelled, so re-running an old run can't cancel the newest deploy.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history: each post lists the commits that changed it
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # The browser tests use a tiny stand-in embedding (SEARCH_EMBEDDINGS=hash) so they are fast and offline.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  semantic-search:
    # Checks the real embedding model end to end: computed at build time, then run in the browser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop --grep @real-model
        env:
          REAL_MODEL: '1'
          SEARCH_EMBEDDINGS: required

  deploy:
    needs: [test, semantic-search]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a queued deploy waits instead of cancelling the running one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history: each post lists the commits that changed it
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Chromium prints the CV to PDF and draws the social preview images after the build.
      - run: npx playwright install --with-deps chromium
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm run build
        env:
          # Picks up the right base path automatically (/Portfolio/ now, / if the repo is renamed or a custom domain is added).
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SEARCH_EMBEDDINGS: required
          RENDERS: required
      # One artifact name per attempt: re-running the job keeps the earlier attempt's
      # artifact, and deploy-pages refuses to choose between two with the same name.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
