[package]
name = "app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Portfolio Studio: Mac app for writing and managing posts (Rust + GPUI)"

[lib]
name = "studio"
path = "src/lib.rs"

[[bin]]
name = "portfolio-studio"
path = "src/main.rs"

# Editor logic, settings and the API client work on every platform and are
# tested on Linux in CI too.
[dependencies]
api = { workspace = true }
client = { workspace = true }
render = { workspace = true }
serde = { workspace = true }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"

# The window and its controls are macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
# GPUI, its macOS platform and the gpui-component widgets, in matching versions.
gpui-kit = "0.9"
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"
